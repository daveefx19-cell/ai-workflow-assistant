<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Workflow Assistant</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="shell">
<section class="hero">
<span class="badge">AI AUTOMATION PORTFOLIO</span>
<h1>AI Workflow Assistant</h1>
<p>Turn a business process into a practical automation plan with triggers, tools, data, safeguards and tests.</p>
</section>
<section class="card">
<label for="request">What would you like to automate?</label>
<textarea id="request" rows="5" placeholder="Example: When a customer submits a website enquiry, save the lead, qualify it with AI, notify sales and send a follow-up."></textarea>
<button id="generate">Generate workflow</button>
<p id="status"></p>
</section>
<section id="result" class="card hidden"></section>
</main>
<script src="/app.js"></script>
</body>
</html>
